<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語会議文字起こし v0.1</title><link rel="stylesheet" href="/assets/site.css"></head><body>
<header><h1>日本語会議文字起こし <small>v0.1 限定ベータ</small></h1><button id="logout" class="subtle">ログアウト</button></header>
<main><section class="intro"><p><strong>公開して差し支えない音声のみ</strong>アップロードしてください。原音声と照合し、誤りを修正してから利用してください。機密情報や個人情報を含む録音は使用しないでください。</p></section>
<section class="panel"><h2>1. 音声アップロード</h2><form id="upload"><label>会議音声 <input id="audiofile" type="file" accept=".mp3,.m4a,.wav,.flac,.ogg,.mp4,.webm,audio/*" required></label><label>話者数 <select id="speakers"><option value="2" selected>2人（推奨・人数既知なら指定）</option><option value="0">自動推定</option><option value="3">3人</option><option value="4">4人</option></select></label><label><input type="checkbox" id="diar" checked> 話者分離する</label><button type="submit">文字起こしを開始</button></form><p id="uploadinfo" role="status"></p><div class="progress"><div id="bar"></div></div></section>
<section class="panel"><h2>2. 履歴・処理状況</h2><p id="jobsstatus" role="status"></p><div id="jobs"></div></section>
<section class="panel" id="editor" hidden><h2>3. 音声を確認して修正</h2><p>再生位置に合わせて発話行を表示します。話者や時刻を修正し、保存してください。</p><audio id="player" controls preload="metadata"></audio><div class="actions"><button id="addrow" type="button" class="subtle">発話行を追加</button><button id="save" type="button">修正を保存</button><a id="download" href="#">TXT / CSV / SRT / JSON ダウンロード</a></div><div id="editstatus" role="status"></div><div id="rows"></div></section></main>
<footer>推論モデルの話者ラベルは人物識別の保証ではありません。音声データは最大24時間保管され、削除できます。</footer><script src="/assets/site.js" defer></script></body></html>
