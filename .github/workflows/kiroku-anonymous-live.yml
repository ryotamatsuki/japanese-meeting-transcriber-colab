name: Modal anonymous Studio - isolated deployment
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kiroku-consecutive-speaker-paragraphs-20261101
    paths:
      - .github/workflows/kiroku-anonymous-live.yml
permissions:
  contents: read
concurrency:
  group: kiroku-anonymous-live-deploy
  cancel-in-progress: false
jobs:
  deploy_and_smoke:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'deploy: publish speaker-paragraph UI by existing Modal production workflow'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and check anonymous smoke script
        run: python -m py_compile scripts/smoke_anonymous_modal_live.py
      - name: Preflight - block without Modal credentials and verified workspace budget
        shell: bash
        run: |
          if [[ -z "${MODAL_TOKEN_ID:-}" || -z "${MODAL_TOKEN_SECRET:-}" ]]; then
            echo "::error::BLOCKED: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must exist in GitHub Actions secrets."
            exit 2
          fi
          if [[ "${KIROKU_BUDGET_VERIFIED:-}" != "yes" ]]; then
            echo "::error::BLOCKED: Confirm real Modal Workspace Budget, Spend Limit and alerting, then set repository variable KIROKU_BUDGET_VERIFIED=yes."
            exit 2
          fi
          echo "Modal credential references and independent budget approval are present."
      - name: Install Modal and HTTP client
        run: python -m pip install modal==1.4.3 httpx==0.28.1
      - name: Ensure dedicated anonymous signing secret without rotating existing sessions
        run: |
          python - <<'PYCODE'
          import modal, secrets
          modal.Secret.objects.create(
              'kiroku-anonymous-session',
              {'BETA_SESSION_SECRET': secrets.token_urlsafe(48)},
              allow_existing=True,
          )
          print('Dedicated anonymous session secret ready (value never logged).')
          PYCODE
      - name: Build production React Studio
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy anonymous app only (never modify passworded beta)
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          modal deploy beta_modal_anonymous.py 2>&1 | tee "$RUNNER_TEMP/kiroku-deploy.log"
          touch "$RUNNER_TEMP/kiroku-deployed"
          python - <<'PY'
          import os, modal
          url=modal.Function.from_name('kiroku-anonymous-studio-beta','anonymous_web').get_web_url()
          if not url or not url.startswith('https://') or not url.endswith('.modal.run'):
              raise SystemExit('Missing deployed anonymous Modal HTTPS URL')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              print('url='+url,file=f)
          print('Anonymous Modal endpoint deployment detected.')
          PY
      - name: Verify anonymous Studio is reachable without spending GPU quota
        env:
          KIROKU_TEST_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python - <<'PY'
          import httpx,os,re
          with httpx.Client(base_url=os.environ['KIROKU_TEST_URL'],timeout=120) as c:
              response=c.get('/')
              assert response.status_code==200
              assert c.get('/api/session').json()['anonymous'] is True
              found=re.findall(r'/ui/assets/[^"\\s<>]+\\.js',response.text)
              assert found, 'Live page did not reference expected JS'
              assets=[]
              for url in set(found):
                  js=c.get(url)
                  assert js.status_code==200,(url,js.status_code)
                  assets.append(js.text)
              combined=''.join(assets)
              assert '同じ話者をまとめて読む' in combined,'New grouping UI not on LIVE endpoint'
              assert '発言単位で編集' in combined,'Editable original rows not in LIVE bundle'
              assert c.get('/api/jobs').status_code==200,'Anonymous owner-scoped jobs API failed'
          print('LIVE_BUNDLE_SPEAKER_PARAGRAPHS_AND_ANONYMOUS_SESSION=PASS')
          PY
      - name: Restore last validated public anonymous Studio if postdeploy checks fail
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/kiroku-deployed" ]] && [[ -n "${MODAL_TOKEN_ID:-}" ]]; then
            echo "::warning::Live verification failed; restoring the previous validated anonymous Studio from pinned Git commit"
            git fetch --depth=1 origin 13ee84c06fa3da6339995e3f6929467ae78417e0
            git checkout --detach 13ee84c06fa3da6339995e3f6929467ae78417e0
            npm ci --no-audit --no-fund --prefix frontend
            npm run build --prefix frontend
            modal deploy beta_modal_anonymous.py
            echo "ROLLBACK_TO_PRIOR_STUDIO_COMPLETED=yes"
          fi
      - name: Publish non-sensitive endpoint verification summary
        if: success()
        shell: bash
        env:
          TEST_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Validated live Studio URL: $TEST_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment and anonymous session bootstrap only; see separate Chromium live acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Physical PC/phone testing remains separate." >> "$GITHUB_STEP_SUMMARY"
