name: Research read current one-shot GPU status
on:
  pull_request:
    branches: [research/qwen-time-diarization-sensitivity-20261031]
permissions:
  contents: read
  actions: read
jobs:
  status:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Inspect exact experiment status and failed stage (no audio)
        run: |
          python - <<'PY'
          import subprocess,json,os
          repo=os.environ["GH_REPO"]
          raw=subprocess.check_output(["gh","api","-X","GET",
           f"repos/{repo}/actions/workflows/once-nvidia-diarizer-20261031.yml/runs",
            "-f","per_page=40"],text=True)
          runs=[r for r in json.loads(raw).get("workflow_runs",[])
           if r.get("head_sha")=="0995d182b6130442770c75ee26ef8f071c9184f5"]
          if not runs:
              print("EXPERIMENT_NOT_TRIGGERED");raise SystemExit()
          v=max(runs,key=lambda r:r["id"])
          print("ONE_SHOT",json.dumps({k:v.get(k) for k in
              ("id","status","conclusion","html_url")}))
          jobs=json.loads(subprocess.check_output(["gh","api","-X","GET",
              f"repos/{repo}/actions/runs/{v['id']}/jobs"],text=True))
          print("STAGES",json.dumps([
              {"name":s["name"],"status":s.get("status"),
               "conclusion":s.get("conclusion")}
              for j in jobs.get("jobs",[]) for s in j.get("steps",[])
              if s.get("name") not in ("Set up job","Complete job",
                                      "Post Checkout","Post Setup Python")]))
          PY
