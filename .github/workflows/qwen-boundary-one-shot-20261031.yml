name: One-shot Qwen text-boundary synthetic GPU test
on:
  push:
    branches: [research/qwen-text-boundary-postprocess-20261031]
    paths:
      - modal_qwen_boundary_gpu_study.py
      - .github/workflows/qwen-boundary-one-shot-20261031.yml
permissions:
  contents: read
concurrency:
  group: kiroku-qwen-boundary-one-shot-20261031
  cancel-in-progress: false
jobs:
  synthetic-qwen-a10:
    if: github.repository == 'ryotamatsuki/japanese-meeting-transcriber-colab'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only Modal CLI
        run: python -m pip install modal==1.4.3
      - name: Run bounded A10 and print synthetic numeric metrics only
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MODAL_TOKEN_ID:-}" || -z "${MODAL_TOKEN_SECRET:-}" ]]; then
            echo 'MODAL_CREDENTIALS_NOT_PRESENT'; exit 2
          fi
          modal run modal_qwen_boundary_gpu_study.py
