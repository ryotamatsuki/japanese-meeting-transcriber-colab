name: Kiroku anonymous Studio - real Chromium desktop and mobile GPU E2E (cold-start tolerant)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kiroku-anonymous-live-deploy
  cancel-in-progress: false
jobs:
  browser_live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce explicitly verified budget gate
        run: test "$KIROKU_BUDGET_VERIFIED" = yes
      - name: Install browser test dependencies
        run: |
          python -m pip install modal==1.4.3 playwright==1.56.0 imageio-ffmpeg==0.6.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current Studio and deploy only the anonymous app
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          npm run build --prefix frontend
          modal deploy beta_modal_anonymous.py
      - name: Resolve current anonymous endpoint
        id: endpoint
        run: |
          python - <<'PY'
          import os,modal
          url=modal.Function.from_name('kiroku-anonymous-studio-beta','anonymous_web').get_web_url()
          if not url or not url.startswith('https://') or not url.endswith('.modal.run'):
              raise SystemExit('Missing deployed anonymous endpoint')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('url='+url,file=f)
          PY
      - name: Prepare two distinct permitted Japanese audio inputs
        run: |
          mkdir -p local_audio
          curl --fail --location --silent --show-error --max-time 60 'https://upload.wikimedia.org/wikipedia/commons/6/63/Ja-LessonIntroKonPron-practice1.ogg' -o local_audio/public-domain-a.ogg
          python - <<'PY'
          import imageio_ffmpeg,subprocess
          subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-v','error','-i','local_audio/public-domain-a.ogg','-ss','8','-t','12','-c:a','libvorbis','local_audio/public-domain-b.ogg'],check=True)
          PY
      - name: Reclaim only deleted pilot test jobs and their test quota
        run: |
          python - <<'PY'
          import modal
          state=modal.Dict.from_name('kiroku-anonymous-studio-jobs-v1')
          allowed={'anonymous-a.ogg','anonymous-b.ogg','public-domain-a.ogg','public-domain-b.ogg'}
          records=[(k,v) for k,v in state.items() if isinstance(k,str) and k.startswith('job:')]
          if (len(records) not in (0,2,4) or state.get('job_index',[]) or
              any(v.get('status')!='deleted' or v.get('filename') not in allowed for k,v in records) or
              len(state.get('gpu_job_times',[]))!=len(records)):
              raise SystemExit('Refuse quota cleanup: state contains unexpected or undeleted work')
          # Only explicitly named, deleted jobs from this authorised pilot, no user workload.
          print('Deleted pilot GPU pipeline seconds:',[value.get('pipeline_seconds') for key,value in records])
          for key,value in records: state.pop(key)
          state['gpu_job_times']=[]
          print('Deleted pilot metadata and matching test quota reclaimed. Production limit remains 4/24h.')
          PY
      - name: UI uploads, real GPU, owner isolation, edit, playback, ZIP and delete
        env:
          KIROKU_TEST_URL: ${{ steps.endpoint.outputs.url }}
          KIROKU_TEST_AUDIO_A: local_audio/public-domain-a.ogg
          KIROKU_TEST_AUDIO_B: local_audio/public-domain-b.ogg
        run: python scripts/browser_anonymous_modal_live.py
      - name: Upload sanitised browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-studio-browser-sanitized
          path: local_runs/browser-anonymous/
          retention-days: 7
      - name: Reclaim only deleted pilot test jobs and their test quota after success
        run: |
          python - <<'PY'
          import modal
          state=modal.Dict.from_name('kiroku-anonymous-studio-jobs-v1')
          allowed={'anonymous-a.ogg','anonymous-b.ogg','public-domain-a.ogg','public-domain-b.ogg'}
          records=[(k,v) for k,v in state.items() if isinstance(k,str) and k.startswith('job:')]
          if (len(records) not in (0,2,4) or state.get('job_index',[]) or
              any(v.get('status')!='deleted' or v.get('filename') not in allowed for k,v in records) or
              len(state.get('gpu_job_times',[]))!=len(records)):
              raise SystemExit('Refuse quota cleanup: state contains unexpected or undeleted work')
          # Only explicitly named, deleted jobs from this authorised pilot, no user workload.
          print('Deleted pilot GPU pipeline seconds:',[value.get('pipeline_seconds') for key,value in records])
          for key,value in records: state.pop(key)
          state['gpu_job_times']=[]
          print('Deleted pilot metadata and matching test quota reclaimed. Production limit remains 4/24h.')
          PY
