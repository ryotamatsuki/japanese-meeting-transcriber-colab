name: Research-only read numeric OneShot status
on:
  pull_request:
    branches:
      - research/qwen-error-decomposition-v1-20261031
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  inspect:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Probe OneShot workflow metadata and optional numeric artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ["GH_REPO"]
          want="57439f900451029c0b8120e56f335c3311b7e35a"
          path="once-open-audio-decomposition-20261031.yml"
          run=None
          for _ in range(20):
              try:
                  raw=subprocess.check_output([
                      "gh","api","-X","GET",
                      f"repos/{repo}/actions/workflows/{path}/runs",
                      "-f","per_page=40"],text=True,stderr=subprocess.PIPE)
                  found=[x for x in json.loads(raw).get("workflow_runs",[])
                         if x.get("head_sha")==want]
              except subprocess.CalledProcessError as exc:
                  print("WORKFLOW_PROBE_ERROR",type(exc).__name__)
                  found=[]
              if found:
                  run=max(found,key=lambda x:x["id"])
                  if run["status"]=="completed":break
              time.sleep(10)
          print("ONE_SHOT_RUN",json.dumps(
              {k:run.get(k) for k in ("id","status","conclusion","html_url")}
              if run else {"found":False}))
          if run and run.get("conclusion")=="failure":
              checks=json.loads(subprocess.check_output(["gh","api","-X","GET",f"repos/{repo}/commits/{want}/check-runs"],text=True))
              print("SOURCE_CHECK_RUNS",json.dumps([{k:x.get(k) for k in ("name","status","conclusion","html_url")} | {"message":(x.get("output") or {}).get("summary","")[:350]} for x in checks.get("check_runs",[])],ensure_ascii=False))
          if not run or run.get("conclusion")!="success":
              print("NO_MEASURED_SUCCESS")
              raise SystemExit()
          artifacts=json.loads(subprocess.check_output(
              ["gh","api","-X","GET",
               f"repos/{repo}/actions/runs/{run['id']}/artifacts"],text=True))
          choices=[x for x in artifacts.get("artifacts",[]) if
              x["name"]=="jcre3-fixed-qwen-attribution-metrics-only"]
          if len(choices)!=1:
              print("METRIC_ARTIFACT_MISSING");raise SystemExit()
          import tempfile,pathlib,zipfile,io
          binary=subprocess.check_output(["gh","api",
             "-H","Accept: application/vnd.github+json",
             f"repos/{repo}/actions/artifacts/{choices[0]['id']}/zip"])
          with zipfile.ZipFile(io.BytesIO(binary)) as z:
              files=[x for x in z.namelist() if x.endswith(".json")]
              if len(files)!=1:raise ValueError("unexpected artifact")
              data=json.loads(z.read(files[0]))
          print("PROXY_DIAGNOSTIC_ONLY",json.dumps({
              "completed":data["completed"],
              "scope":data["dataset"],
              "records":[{
                 "record_id":x["record_id"],
                 "flat_cer":x.get("flattened_cer"),
                 "baseline_cpcer":x.get("baseline_original_cpcer"),
                 "conservative_exclusive_cpcer":x.get("arms",{}).get("conservative_exclusive",{}).get("cpcer"),
                 "conservative_regular_cpcer":x.get("arms",{}).get("conservative_regular",{}).get("cpcer"),
               } for x in data["records"]]},ensure_ascii=False))
          PY
