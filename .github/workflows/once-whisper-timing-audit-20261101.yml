# Trigger-once after verified A10 startup smoke Run 41259818763.
# Keeps original frozen models and evaluates the three pinned research samples.
name: One shot - frozen Whisper Community word timing actual A10
on:
  push:
    branches:
      - research/word-timing-boundary-aware-ablation-20261101
    paths:
      - .github/workflows/once-whisper-timing-audit-20261101.yml
permissions:
  contents: read
concurrency:
  group: kiroku-whisper-word-timing-research-20261101
  cancel-in-progress: false
jobs:
  same_model_timing_eval:
    if: "github.event.head_commit.message == 'research: execute one-shot Whisper word timing evaluation'"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
      DATASET: docs/jcre3_unseen_manifest_20261031.json
      PRIVATE: /tmp/kiroku-audio-eval.zip
      METRICS: /tmp/whisper_timing_metrics.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research-only authorization, pinned provenance, preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${KIROKU_BUDGET_VERIFIED:-}" = "yes" || { echo "::error::Budget preflight blocked"; exit 2; }
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}" || { echo "::error::Missing Modal credentials"; exit 2; }
          grep -F 'J-CRe3' "$DATASET"
          grep -F 'CC BY-SA 4.0' "$DATASET"
          grep -F 'WhisperModel' transcriber/asr.py
          grep -F 'community-1' transcriber/diarization.py
          echo 'PINNED_SOURCE_AND_FIXED_BASELINE=PASS'
      - name: Install fixed research runner dependencies
        run: |
          python -m pip install -r requirements-beta-test.txt modal==1.4.3 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run frozen comparison offline regression tests
        run: |
          python -m unittest -v tests.test_whisper_speaker_timing_audit
          python -m py_compile modal_whisper_word_timing_audit.py scripts/whisper_speaker_timing_audit.py
      - name: Reacquire exact CC-BY-SA J-CRe3 public research samples privately
        run: |
          python scripts/jcre3_reacquire_private.py --manifest "$DATASET" --out "$PRIVATE"
          test -s "$PRIVATE"
          chmod 600 "$PRIVATE"
      - name: Transfer input into one-use private Modal research Volume
        shell: bash
        run: |
          set -euo pipefail
          modal volume create kiroku-whisper-timing-audit-inputs-20261101 || modal volume ls
          modal volume put kiroku-whisper-timing-audit-inputs-20261101 "$PRIVATE" /eval.zip
          rm -f "$PRIVATE"
          echo 'PRIVATE_INPUT_TRANSFER=PASS'
      - name: Verify real GPU imports, mounted inputs, Secret and model Volume first
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s modal run -n kiroku-whisper-timing-preflight-20261101 modal_whisper_word_timing_audit.py::startup_check
          echo 'ISOLATED_A10_STARTUP_PREFLIGHT=PASS'
      - name: Actual A10 frozen Whisper Community-1 speaker-timing evaluation
        shell: bash
        run: |
          set -euo pipefail
          timeout 2400s modal run modal_whisper_word_timing_audit.py --output "$METRICS"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['METRICS'])
          j=json.loads(p.read_text())
          assert j['completed'] is True and len(j['rows'])==3
          assert all(r['claims']['whisper_words_frozen'] and
                     r['claims']['community_regions_frozen'] and
                     r['status']=='success' for r in j['rows'])
          assert all('guarded_boundary' in r['rules'] and
                     r['rules']['guarded_boundary']['relabeled_words']>=0
                     for r in j['rows'])
          assert all(r['rules']['legacy']['edits']==r['shift_sensitivity_diagnostic_only']['0.0']['edits']
                     for r in j['rows'])
          print('ACTUAL_A10_3_OF_3_RESEARCH_SAMPLES_COMPLETE=PASS')
          PY
      - name: Prepare numerical summary only
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          j=json.loads(Path(os.environ['METRICS']).read_text())
          rules=['legacy','midpoint','onset','end','vote_no_fallback','guarded_boundary']
          counts=sum(r['reference_characters'] for r in j['rows'])
          table={rule:{
            'total_edits':sum(r['rules'][rule]['edits'] for r in j['rows']),
            'total_reference_chars':counts,
            'micro_cpcer_percent':round(100*sum(r['rules'][rule]['edits'] for r in j['rows'])/counts,4),
            'per_record_cpcer_percent':[round(r['rules'][rule]['cpcer']*100,4) for r in j['rows']],
            'total_switches':sum(r['rules'][rule]['switches'] for r in j['rows']),
            'disagreement_words_vs_legacy':sum(r['disagreement_words_vs_legacy'].get(rule,0) for r in j['rows'])
          } for rule in rules}
          shifts={offset:{
            'total_edits':sum(r['shift_sensitivity_diagnostic_only'][offset]['edits'] for r in j['rows']),
            'micro_cpcer_percent':round(100*sum(r['shift_sensitivity_diagnostic_only'][offset]['edits'] for r in j['rows'])/counts,4),
            'per_record_edits':[r['shift_sensitivity_diagnostic_only'][offset]['edits'] for r in j['rows']]
          } for offset in ('-0.3','-0.15','0.0','0.15','0.3')}
          out={'dataset':j['dataset'],'model':j['model'],
               'source':j['audio'],'reference':j['human_reference'],
               'samples':len(j['rows']),'reference_characters':counts,
               'word_count':sum(r['word_count'] for r in j['rows']),
               'rule_scores':table,'shift_sensitivity_only':shifts,
               'per_record':[
                  {'record_id':r['record_id'],'audio_seconds':r['audio_seconds'],
                   'word_count':r['word_count'],'asr_seconds':r['asr_seconds'],
                   'diarization_seconds':r['diarization_seconds'],
                   'boundary_words_150ms':r['rules']['legacy']['words_center_within_150ms_of_auto_region_start'],
                   'boundary_words_300ms':r['rules']['legacy']['words_center_within_300ms_of_auto_region_start'],
                   'no_overlap_words':r['rules']['legacy']['words_without_region_overlap']}
                  for r in j['rows']],
               'warnings':['PREVIOUSLY DEVELOPMENT DATA, not held-out',
                 'ACTED HOUSEHOLD DIALOGUE, not authentic meetings',
                 'Human annotations are turn level, not word timing truth',
                 'Winner selected on these references is not validation',
                 'No real user meeting or private account job was accessed',
                 'No production model/app changes']}
          path=Path('whisper_timing_summary_metrics_only.json')
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('FROZEN_TIMING_METRICS_ONLY',json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: whisper-community-word-timing-numeric-audit
          path: |
            whisper_timing_summary_metrics_only.json
          retention-days: 30
          if-no-files-found: error
      - name: Destroy private research audio and stop isolated GPU app
        if: always()
        shell: bash
        run: |
          rm -f "$PRIVATE" "$METRICS"
          if [[ -n "${MODAL_TOKEN_ID:-}" && -n "${MODAL_TOKEN_SECRET:-}" ]]; then
            modal volume rm kiroku-whisper-timing-audit-inputs-20261101 /eval.zip || true
            modal app stop --yes kiroku-whisper-timing-audit-20261101 || true
          fi
          echo 'ONE_SHOT_RESEARCH_CLEANUP_ATTEMPTED'
