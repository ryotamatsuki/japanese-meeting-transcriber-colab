name: Once - deploy opt-in speaker-stability trial to anonymous Studio
on:
  push:
    branches:
      - feature/kiroku-live-speaker-stability-trial-20261101
    paths:
      - .github/workflows/once-live-speaker-trial-20261101.yml
permissions:
  contents: read
concurrency:
  group: kiroku-anonymous-live-deploy
  cancel-in-progress: false
jobs:
  trial_deploy:
    if: "github.event.head_commit.message == 'deploy: live speaker-stability trial with default-off toggle'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety and identity preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${KIROKU_BUDGET_VERIFIED:-}" = yes || { echo "::error::Budget gate not approved"; exit 2; }
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}" || { echo "::error::Modal credentials unavailable"; exit 2; }
          grep -F "modal.App('kiroku-anonymous-studio-beta')" beta_modal_anonymous.py
          grep -F "kiroku-anonymous-studio-files-v1" beta_modal_anonymous.py
          grep -F "kiroku-anonymous-studio-jobs-v1" beta_modal_anonymous.py
          grep -F "kiroku-anonymous-session" beta_modal_anonymous.py
          grep -F "speaker_stability" beta/backend.py
          grep -F "word_stability_ms=450 if trial else 0" beta_modal_anonymous.py
          echo "PRESERVE_EXISTING_APP_AND_STORAGE=PASS"
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-beta-test.txt modal==1.4.3 httpx==0.28.1
      - name: Validate all Python tests, notebook, Node tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/check_notebook.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m compileall -q beta transcriber beta_modal_anonymous.py
          node --experimental-strip-types --test frontend/tests/*.test.mjs
      - name: Build React trial UI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix frontend
          npm run build --prefix frontend
          python - <<'PY'
          from pathlib import Path
          text=''.join(p.read_text(encoding='utf-8') for p in Path('beta/react_dist/assets').glob('*.js'))
          assert '話者分離の改善を試す' in text
          assert '試験機能' in text
          assert '同じ話者をまとめて読む' in text
          print('TRIAL_UI_BUNDLE=PASS')
          PY
      - name: Deploy only the existing anonymous Modal app
        shell: bash
        run: |
          set -euo pipefail
          modal deploy beta_modal_anonymous.py
          touch "$RUNNER_TEMP/kiroku-trial-deployed"
          echo "TRIAL_MODAL_DEPLOY=PASS"
      - name: Verify live anonymous Studio is serving new JS and the existing session APIs
        shell: bash
        run: |
          python - <<'PY'
          import httpx,modal,time
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__();self.paths=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      src=dict(attrs).get('src','')
                      if src.startswith('/ui/assets/') and src.endswith('.js'):
                          self.paths.append(src)
          url=modal.Function.from_name('kiroku-anonymous-studio-beta','anonymous_web').get_web_url()
          assert url and url.startswith('https://') and url.endswith('.modal.run')
          with httpx.Client(base_url=url,timeout=120) as client:
              for i in range(12):
                  response=client.get('/')
                  if response.status_code!=200:
                      reason='page not available'
                  else:
                      parser=Scripts();parser.feed(response.text)
                      content=''.join(client.get(p).text for p in parser.paths)
                      session=client.get('/api/session')
                      jobs=client.get('/api/jobs')
                      if ('話者分離の改善を試す' in content and
                          '話者補正の試験モード' in content and
                          '同じ話者をまとめて読む' in content and
                          session.status_code==200 and session.json().get('anonymous') is True and
                          jobs.status_code==200 and 'jobs' in jobs.json()):
                          print('LIVE_TRIAL_UI_ASSETS=PASS')
                          print('LIVE_OWNER_SCOPED_SESSION_AND_JOBS=PASS')
                          print('LIVE_URL='+url)
                          break
                      reason='trial code not yet served or session/jobs not healthy'
                  if i==11:
                      raise AssertionError('LIVE_VERIFICATION_FAILED: '+reason)
                  time.sleep(4)
          PY
      - name: Roll back to last validated Studio if verification failed after deploy
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/kiroku-trial-deployed" && -n "${MODAL_TOKEN_ID:-}" ]]; then
            set -euo pipefail
            echo "::warning::Verification failed. Restoring pre-trial validated anonymous Studio"
            git fetch --depth=1 origin 8a46ca8f73313cf88f4075226c417f05714b36b0
            git checkout --detach 8a46ca8f73313cf88f4075226c417f05714b36b0
            npm ci --no-audit --no-fund --prefix frontend
            npm run build --prefix frontend
            modal deploy beta_modal_anonymous.py
            echo "ROLLBACK_PRETRIAL_STUDIO=PASS"
          fi
      - name: Non-sensitive run summary
        if: always()
        run: |
          echo "Target is unchanged anonymous Modal Studio with persistent data Volume, job Dict and session secret." >> "$GITHUB_STEP_SUMMARY"
          echo "Default trial OFF: only opted-in jobs use 450 ms short speaker A-B-A stabilization; ASR and diarizer models unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "Run makes no real audio uploads or GPU job reservations. Verify live UI and API outcome before reporting deployment success." >> "$GITHUB_STEP_SUMMARY"
