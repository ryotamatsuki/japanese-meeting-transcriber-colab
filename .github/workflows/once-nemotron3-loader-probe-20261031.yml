name: One-shot Nemotron3 Transformers synthetic-only loader probe
on:
  push:
    branches: [research/nemotron3-sortformer-jcre3-20261031]
    paths: [.github/workflows/once-nemotron3-loader-probe-20261031.yml]
permissions:
  contents: read
concurrency:
  group: nemotron3-synthetic-loader-probe-20261031
  cancel-in-progress: false
jobs:
  probe:
    if: "github.event.head_commit.message == 'research: retry Nemotron3 synthetic GPU loader without accelerate'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - name: Install Modal client
        run: |
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}"
          python -m pip install modal==1.4.3
      - name: Run on A10, public model and generated silence only
        run: |
          modal deploy modal_nemotron3_loader_probe.py
          modal run modal_nemotron3_loader_probe.py --output /tmp/nemotron3-synthetic-probe.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/nemotron3-synthetic-probe.json"))
          assert x["not_real_speech"] and x["status"] in ("pass","failed")
          print("NEMOTRON3_PROBE_STATUS",x["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemotron3-synthetic-loader-metrics-only
          path: /tmp/nemotron3-synthetic-probe.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop ephemeral loader app
        if: always()
        run: |
          modal app stop --yes kiroku-nemotron3-model-load-probe-20261031 || true
          rm -f /tmp/nemotron3-synthetic-probe.json
