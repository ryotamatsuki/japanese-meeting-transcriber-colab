name: One-shot J-CRe3 official Box browser UI test
on:
  push:
    branches: [research/qwen-prosody-boundary-fourarm-20261031]
    paths:
      - scripts/jcre3_box_browser_probe_once.py
      - .github/workflows/jcre3-box-browser-probe-once.yml
permissions:
  contents: read
jobs:
  licensed-box-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Use publicly documented Box password via visible UI, metadata-only results
        run: python scripts/jcre3_box_browser_probe_once.py
