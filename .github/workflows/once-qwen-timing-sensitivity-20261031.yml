name: ONE-SHOT licensed J-CRe3 frozen-ASR timing vs diarization sensitivity
on:
  push:
    branches:
      - research/qwen-time-diarization-sensitivity-20261031
    paths:
      - .github/workflows/once-qwen-timing-sensitivity-20261031.yml
permissions:
  contents: read
concurrency:
  group: once-qwen-timing-sensitivity-20261031
  cancel-in-progress: false
jobs:
  one-shot:
    # This exact add commit only; deleting or modifying the workflow cannot rerun.
    if: "github.event.head_commit.message == 'research: execute one-shot frozen Qwen timing sensitivity A10'"
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bound permissions and verify credentials
        shell: bash
        run: |
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}"
          test "${GITHUB_REF_NAME}" = "research/qwen-time-diarization-sensitivity-20261031"
          echo "One A10 invocation, zero retries; this is acted household dialogue, not held-out meeting."
      - name: Install source acquisition and Modal clients
        run: |
          python -m pip install playwright==1.56.0 modal==1.4.3
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reacquire exactly pinned public-license audio and human references
        run: |
          python -m scripts.jcre3_reacquire_private \
            --manifest docs/jcre3_unseen_manifest_20261031.json \
            --out /tmp/jcre3-ablation-private.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile,json
          x=Path("/tmp/jcre3-ablation-private.zip")
          assert 5000000 <= x.stat().st_size < 10000000
          with zipfile.ZipFile(x) as z:
              manifest=json.loads(z.read("manifest.json"))
              assert len(manifest["records"])==3
              assert manifest["license"]=="CC BY-SA 4.0"
              for item in manifest["records"]:
                  rid=item["id"]
                  assert hashlib.sha256(z.read(rid+"/preview.mp3")).hexdigest()==item["audio_sha256"]
                  assert hashlib.sha256(z.read(rid+"/reference.txt")).hexdigest()==item["reference_sha256"]
          print("SIX_ORIGINAL_AUDIO_AND_REFERENCE_SHAS_MATCH=yes")
          PY
      - name: Deploy separate ephemeral research app and send private package
        run: |
          modal deploy modal_qwen_timing_sensitivity.py
          modal volume put kiroku-qwen-timing-sensitivity-20261031-01 /tmp/jcre3-ablation-private.zip /eval.zip
      - name: Execute EXACTLY one A10 fixed-ASR ablation
        run: |
          modal run modal_qwen_timing_sensitivity.py --output /tmp/ablation-metrics-only.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/ablation-metrics-only.json"))
          assert x["dataset"].startswith("J-CRe3")
          assert x["completed"], "Some records failed: no success claim"
          assert len(x["records"])==3
          assert all(v["status"]=="success" for v in x["records"])
          print("THREE_RECORDS_ABLATION_COMPLETE=yes")
          PY
      - name: Upload METRICS ONLY, never audio/transcripts
        uses: actions/upload-artifact@v4
        with:
          name: jcre3-qwen-timing-sensitivity-metrics-only
          path: /tmp/ablation-metrics-only.json
          retention-days: 7
      - name: Destroy project-only input and stop ephemeral app
        if: always()
        shell: bash
        run: |
          modal app stop --yes kiroku-qwen-timing-sensitivity-20261031-01 || true
          modal volume rm kiroku-qwen-timing-sensitivity-20261031-01 /eval.zip || true
          rm -f /tmp/jcre3-ablation-private.zip /tmp/ablation-metrics-only.json
