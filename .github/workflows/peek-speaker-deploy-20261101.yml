name: One-shot Kiroku deploy verification status
on:
  push:
    branches: [feature/kiroku-consecutive-speaker-paragraphs-20261101]
    paths: [.github/workflows/peek-speaker-deploy-20261101.yml]
permissions:
  actions: read
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Inspect one-shot deploy run and step states (no secrets or audio)
        run: |
          python - <<'PY'
          import subprocess,json,os
          repo=os.environ['GH_REPO']
          raw=subprocess.check_output(['gh','api','-X','GET',
            f'repos/{repo}/actions/runs','-f','per_page=60'],text=True)
          runs=json.loads(raw)['workflow_runs']
          filtered=[r for r in runs if
            r.get('name')=='ONE SHOT deploy Kiroku consecutive-speaker paragraphs'
            and r.get('head_sha')=='1d7281ae3760565ad96899812d795eaa4b72c843']
          if not filtered:
            print('DEPLOY_NOT_FOUND');raise SystemExit(0)
          r=max(filtered,key=lambda z:z['id'])
          print('DEPLOY_RUN_STATUS',json.dumps({k:r.get(k) for k in
            ['id','status','conclusion','html_url']}))
          jobs=json.loads(subprocess.check_output(['gh','api','-X','GET',
             f'repos/{repo}/actions/runs/{r["id"]}/jobs'],text=True))
          print('DEPLOY_STEPS',json.dumps([{k:v.get(k) for k in ['name','status','conclusion']}
             for job in jobs.get('jobs',[]) for v in job.get('steps',[])]))
          PY
