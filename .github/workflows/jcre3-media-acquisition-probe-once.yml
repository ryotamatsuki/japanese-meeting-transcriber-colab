name: One-time J-CRe3 public media acquisition diagnostic
on:
  push:
    branches: [research/qwen-prosody-boundary-fourarm-20261031]
    paths:
      - scripts/jcre3_acquisition_probe.py
      - .github/workflows/jcre3-media-acquisition-probe-once.yml
permissions:
  contents: read
jobs:
  public-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official public Box preview and pinned ELAN reference (numeric-only)
        run: python scripts/jcre3_acquisition_probe.py
