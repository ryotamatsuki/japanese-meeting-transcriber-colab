name: One-time Qwen four-arm synthetic A10 research
on:
  push:
    branches: [research/qwen-prosody-boundary-fourarm-20261031]
    paths:
      - modal_qwen_boundary_fourarm_synthetic.py
      - .github/workflows/qwen-fourarm-one-shot-20261031.yml
permissions:
  contents: read
concurrency:
  group: kiroku-fourarm-synthetic-a10-once-20261031
  cancel-in-progress: false
jobs:
  synthetic-fourarm:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install modal==1.4.3
      - name: Bounded A10 one-shot research (synthetic only)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}"
          test "${KIROKU_BUDGET_VERIFIED:-}" = yes
          modal run modal_qwen_boundary_fourarm_synthetic.py
