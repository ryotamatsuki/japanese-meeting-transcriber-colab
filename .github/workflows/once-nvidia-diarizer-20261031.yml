name: One-shot matched Community Sortformer Nemotron JCre3
on:
  push:
    branches: [research/nemotron3-sortformer-jcre3-20261031]
    paths: [.github/workflows/once-nvidia-diarizer-20261031.yml]
permissions:
  contents: read
concurrency:
  group: once-nvidia-diarizer-20261031
  cancel-in-progress: false
jobs:
  matched-real-gpu:
    if: "github.event.head_commit.message == 'research: final A10 NVIDIA benchmark using validated Transformers Nemotron3'"
    runs-on: ubuntu-latest
    timeout-minutes: 39
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify research-only budget bound and Modal secret
        run: |
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}"
          test "$GITHUB_REF_NAME" = research/nemotron3-sortformer-jcre3-20261031
          echo "RESEARCH_ONLY=YES; A10 fixed ASR once + competing models once; no retries."
      - name: Install access clients
        run: |
          python -m pip install modal==1.4.3 playwright==1.56.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Acquire pinned J-CRe3 CC BY-SA files and verify six individual hashes
        run: |
          python -m scripts.jcre3_reacquire_private \
            --manifest docs/jcre3_unseen_manifest_20261031.json \
            --out /tmp/frozen-original-private.zip
          python - <<'PY'
          import zipfile,hashlib,json
          with zipfile.ZipFile("/tmp/frozen-original-private.zip") as a:
              m=json.loads(a.read("manifest.json"))
              assert m["license"]=="CC BY-SA 4.0" and len(m["records"])==3
              for r in m["records"]:
                  rid=r["id"]
                  assert hashlib.sha256(a.read(rid+"/preview.mp3")).hexdigest()==r["audio_sha256"]
                  assert hashlib.sha256(a.read(rid+"/reference.txt")).hexdigest()==r["reference_sha256"]
          print("SIX_PINNED_SOURCE_HASHES_MATCH")
          PY
      - name: Mount temporary private J-CRe3 inputs in new Modal volume
        run: |
          modal deploy modal_nvidia_frozen_qwen.py
          modal volume put kiroku-nvidia-diarizer-compare-20261031-01 /tmp/frozen-original-private.zip /eval.zip
      - name: Freeze Qwen3-ASR and Community-1 against actual audio (A10)
        run: |
          modal run modal_nvidia_frozen_qwen.py --output /tmp/freeze-metrics-only.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/freeze-metrics-only.json"))
          assert x["completed"] and len(x["records"])==3
          assert all(r["status"]=="success" for r in x["records"])
          print("QWEN_COMMUNITY_FROZEN_3=YES")
          PY
      - name: Build isolated NeMo and evaluate both NVIDIA diarizers on same audio (A10)
        run: |
          modal deploy modal_nvidia_diarizer_headtohead.py
          modal run modal_nvidia_diarizer_headtohead.py --output /tmp/nvidia-matched-metrics-only.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/nvidia-matched-metrics-only.json"))
          assert len(x["records"])==3
          for r in x["records"]:
              assert r["reference_chars"] in [214,301,299]
              assert "community" in r
          print("MATCHED_DIARIZER_EVAL_RETURNED_NUMERIC_ONLY",x["all_completed"])
          PY
      - name: Publish metrics only, never audio, human text or Qwen lexical content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcre3-nvidia-community-matched-metrics-only
          path: |
            /tmp/freeze-metrics-only.json
            /tmp/nvidia-matched-metrics-only.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy project-only Modal audio, private references and frozen ASR
        if: always()
        shell: bash
        run: |
          modal app stop --yes kiroku-nvidia-diarizer-headtohead-20261031-01 || true
          modal app stop --yes kiroku-nvidia-diarizer-compare-20261031-01 || true
          V=kiroku-nvidia-diarizer-compare-20261031-01
          modal volume rm "$V" /eval.zip || true
          for id in 20220302-56130322-0 20220303-56130205-1 20220304-56132112-1; do
            modal volume rm "$V" "/frozen/$id.json" || true
            modal volume rm "$V" "/frozen/$id.wav" || true
          done
          rm -f /tmp/frozen-original-private.zip /tmp/freeze-metrics-only.json /tmp/nvidia-matched-metrics-only.json
