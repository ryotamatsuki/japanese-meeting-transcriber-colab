name: Validate notebook and private beta
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install beta API test dependencies
        run: python -m pip install -r requirements-beta-test.txt modal==1.4.3
      - name: Check original notebook
        run: python tests/check_notebook.py
      - name: Run all offline regression and beta integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Report Modal deployment prerequisites without printing secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
        shell: bash
        run: |
          if [[ -n "${MODAL_TOKEN_ID:-}" && -n "${MODAL_TOKEN_SECRET:-}" ]]; then
            echo "MODAL_DEPLOY_CREDENTIALS_CONFIGURED=yes"
          else
            echo "MODAL_DEPLOY_CREDENTIALS_CONFIGURED=no"
          fi
          if [[ "${KIROKU_BUDGET_VERIFIED:-}" == "yes" ]]; then
            echo "KIROKU_BUDGET_APPROVAL_CONFIGURED=yes"
          else
            echo "KIROKU_BUDGET_APPROVAL_CONFIGURED=no"
          fi
      - name: Verify Modal SDK decorators and deployment module import
        run: python -c 'import beta_modal, beta_modal_anonymous; assert beta_modal.app is not None and beta_modal_anonymous.app is not None'
      - name: Verify beta browser JavaScript syntax
        run: node --check beta/site.js
      - name: Verify Python syntax
        run: python -m compileall -q beta beta_modal.py beta_modal_anonymous.py scripts/smoke_anonymous_modal_live.py transcriber
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test copy text formats for smartphone paste
        run: node --experimental-strip-types --test frontend/tests/transcriptCopy.test.mjs
      - name: Install React frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build React production assets
        working-directory: frontend
        run: npm run build
      - name: Ensure authenticated FastAPI bundle paths exist
        run: |
          test -s beta/react_dist/index.html
          test -n "$(find beta/react_dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find beta/react_dist/assets -maxdepth 1 -name '*.css' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-react-production-bundle
          path: |
            beta/react_dist/
            frontend/package-lock.json
          retention-days: 7

  react-browser-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build React Studio for browser test
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and smartphone copy, formats and clipboard fallback
        run: python scripts/browser_react_stage37_smoke.py
  qwen-research-screen-once:
    name: Qwen fixed-weights pilot (one-off, isolated GPU)
    needs: tests
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/qwen-fixed-weights-quality-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kiroku-qwen-fixed-weights-pilot-01
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Budget and credentials fail-closed (no settings mutation)
        run: |
          if [[ -z "${MODAL_TOKEN_ID:-}" || -z "${MODAL_TOKEN_SECRET:-}" || "${KIROKU_BUDGET_VERIFIED:-}" != yes ]]; then
            echo "::error::GPU pilot blocked without credentials and operator budget flag"
            exit 2
          fi
      - name: Fetch only public noncommercial evaluation sample
        run: |
          sudo apt-get -qq update && sudo apt-get install -y -qq ffmpeg
          python -m pip install modal==1.4.3 huggingface-hub==0.36.0
          python - <<'PY'
          import hashlib,os,pathlib,subprocess
          from huggingface_hub import hf_hub_download
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"qwen-input"
          root.mkdir()
          repo="IngCrowd/japanese-themed-dialogue"
          source="japanese-themed-dialogue01/japanese-themed-dialogue01"
          wav=hf_hub_download(repo_id=repo,repo_type="dataset",filename=source+"_audio.wav")
          eaf=hf_hub_download(repo_id=repo,repo_type="dataset",filename=source+".eaf")
          reference=pathlib.Path(eaf).read_bytes()
          digest=hashlib.sha256(reference).hexdigest()
          assert digest=="c59daa71d0ffa34e50b4c532d33f5c0d2a51ceaa8aea4435a68a87d924f61b32"
          (root/"reference.eaf").write_bytes(reference)
          subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin","-y",
                          "-i",str(wav),"-ar","16000","-ac","1",
                          "-b:a","48k",str(root/"reference.mp3")],check=True)
          print("RESEARCH_INPUT_VERIFIED",digest)
          PY
      - name: One isolated A10 invocation, three chunk variants
        run: |
          modal run modal_qwen_quality_ablation.py \
            --audio "$RUNNER_TEMP/qwen-input/reference.mp3" \
            --eaf "$RUNNER_TEMP/qwen-input/reference.eaf" \
            --record-id 01 --output "$RUNNER_TEMP/qwen-quality-record01-numeric.json"
      - name: Verify numerical pairing and print metadata only
        run: |
          python - <<'PY'
          import json,os,pathlib,math
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"qwen-quality-record01-numeric.json"
          x=json.loads(p.read_text())
          assert x["record_id"]=="01"
          assert len(x["conditions"])==3
          assert [v["max_chunk_seconds"] for v in x["conditions"]]==[30,15,45]
          assert x["conditions"][0]["status"]=="success"
          assert all(math.isfinite(v["inference_and_eval_seconds"]) for v in x["conditions"])
          print("RESEARCH_CONDITION_STATUS",[(v["name"],v["status"],
            round(v.get("cpcer",-1)*100,3)) for v in x["conditions"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-fixed-weight-01-numeric-only
          path: ${{ runner.temp }}/qwen-quality-record01-numeric.json
          retention-days: 7
