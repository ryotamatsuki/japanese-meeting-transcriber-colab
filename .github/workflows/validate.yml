name: Validate notebook and private beta
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install beta API test dependencies
        run: python -m pip install -r requirements-beta-test.txt modal==1.4.3
      - name: Check original notebook
        run: python tests/check_notebook.py
      - name: Run all offline regression and beta integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Report Modal deployment prerequisites without printing secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
        shell: bash
        run: |
          if [[ -n "${MODAL_TOKEN_ID:-}" && -n "${MODAL_TOKEN_SECRET:-}" ]]; then
            echo "MODAL_DEPLOY_CREDENTIALS_CONFIGURED=yes"
          else
            echo "MODAL_DEPLOY_CREDENTIALS_CONFIGURED=no"
          fi
          if [[ "${KIROKU_BUDGET_VERIFIED:-}" == "yes" ]]; then
            echo "KIROKU_BUDGET_APPROVAL_CONFIGURED=yes"
          else
            echo "KIROKU_BUDGET_APPROVAL_CONFIGURED=no"
          fi
      - name: Verify Modal SDK decorators and deployment module import
        run: python -c 'import beta_modal, beta_modal_anonymous; assert beta_modal.app is not None and beta_modal_anonymous.app is not None'
      - name: Verify beta browser JavaScript syntax
        run: node --check beta/site.js
      - name: Verify Python syntax
        run: python -m compileall -q beta beta_modal.py beta_modal_anonymous.py scripts/smoke_anonymous_modal_live.py transcriber
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test copy text formats for smartphone paste
        run: node --experimental-strip-types --test frontend/tests/transcriptCopy.test.mjs
      - name: Install React frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build React production assets
        working-directory: frontend
        run: npm run build
      - name: Ensure authenticated FastAPI bundle paths exist
        run: |
          test -s beta/react_dist/index.html
          test -n "$(find beta/react_dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find beta/react_dist/assets -maxdepth 1 -name '*.css' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-react-production-bundle
          path: |
            beta/react_dist/
            frontend/package-lock.json
          retention-days: 7

  react-browser-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build React Studio for browser test
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and smartphone copy, formats and clipboard fallback
        run: python scripts/browser_react_stage37_smoke.py

  jcre3-deploy-once:
    needs: tests
    if: ${{ github.event_name == 'push' && github.ref_name == 'research/qwen-fixed-weights-quality-20261031' && contains(github.event.head_commit.message, '[jcre3-pilot-once]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KIROKU_BUDGET_VERIFIED: ${{ vars.KIROKU_BUDGET_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Credentials and existing budget flag required
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          test "$KIROKU_BUDGET_VERIFIED" = yes
      - run: python -m pip install modal==1.4.3
      - name: Deploy isolated intake and private evaluation function
        run: modal deploy modal_qwen_unseen_jcre3.py
      - name: Print temporary intake URL only
        run: |
          python - <<'PYCODE'
          import modal
          f=modal.Function.from_name('kiroku-jcre3-unseen-pilot-20261031-01','intake')
          print('JCRE3_INTAKE_URL',f.get_web_url())
          PYCODE

  jcre3-evaluate-once:
    needs: jcre3-deploy-once
    if: ${{ needs.jcre3-deploy-once.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: kiroku-jcre3-unseen-once-20261031
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install modal==1.4.3
      - name: Wait on CPU for the fixed, licensed corpus input
        run: |
          python - <<'PYCODE'
          import modal,time
          volume=modal.Volume.from_name('kiroku-jcre3-unseen-inputs-20261031-01')
          deadline=time.monotonic()+600
          while time.monotonic()<deadline:
              if any(v.path.strip('/')=='eval.zip' for v in volume.listdir('/')):
                  print('JCRE3_INPUT_PRESENT');break
              time.sleep(5)
          else:
              raise SystemExit('Corpus input did not arrive; no GPU invoked')
          PYCODE
      - name: One A10 invocation, frozen 30-second baseline on three records
        run: modal run modal_qwen_unseen_jcre3.py --output "$RUNNER_TEMP/jcre3-numeric.json"
      - name: Verify evaluation actually completed
        run: |
          python - <<'PYCODE'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'jcre3-numeric.json').read_text())
          assert len(r['records'])==3
          assert r['successful_records']==3, 'See numeric per-record failure stage'
          PYCODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: jcre3-unseen-numeric-only
          path: ${{ runner.temp }}/jcre3-numeric.json
          retention-days: 7
      - name: Stop only this temporary pilot app
        if: ${{ always() }}
        run: modal app stop kiroku-jcre3-unseen-pilot-20261031-01
      - name: Remove only the temporary evaluation input
        if: ${{ always() }}
        continue-on-error: true
        run: modal volume rm kiroku-jcre3-unseen-inputs-20261031-01 /eval.zip
