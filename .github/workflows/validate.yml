name: Validate notebook

on:
  push:
  pull_request:

jobs:
  notebook-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check notebook without downloading models or audio
        run: python3 tests/check_notebook.py
      - name: Check extracted pipeline offline (no GPU claims)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
