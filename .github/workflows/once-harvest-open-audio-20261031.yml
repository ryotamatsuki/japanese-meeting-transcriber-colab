name: ONE-SHOT harvest numeric J-CRe3 ablation evidence
on:
  push:
    branches: [research/open-audio-empirical-ablation-20261031]
    paths: [.github/workflows/once-harvest-open-audio-20261031.yml]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  harvest:
    if: "github.event.head_commit.message == 'research: harvest one-shot numeric ablation result'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Find previous exact push-run and read result only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ["GH_REPO"]
          sha="3228b9df87d914276dd716d9e524d49e76c02660"
          wf="once-open-audio-decomposition-20261031.yml"
          selected=None
          for trial in range(30):
              raw=subprocess.check_output([
                 "gh","api","-X","GET",f"repos/{repo}/actions/workflows/{wf}/runs",
                 "-f","per_page=30"],text=True)
              runs=json.loads(raw).get("workflow_runs",[])
              matches=[r for r in runs if r.get("head_sha")==sha and r.get("event")=="push"]
              if matches:
                  selected=max(matches,key=lambda r:r["id"])
                  if selected["status"]=="completed":
                      break
              time.sleep(10)
          if not selected:
              raise RuntimeError("ONE_SHOT_RUN_NOT_FOUND")
          metadata={k:selected.get(k) for k in (
              "id","html_url","status","conclusion","head_sha")}
          with open("/tmp/one-shot-run.json","w") as f:json.dump(metadata,f)
          print("SOURCE_RUN_METADATA "+json.dumps(metadata))
          if selected["status"]!="completed":
              raise RuntimeError("ONE_SHOT_RUN_NOT_FINISHED")
          PY
      - name: Read numeric-only artifact and comment on PR
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,pathlib
          metadata_file=pathlib.Path("/tmp/one-shot-run.json")
          if not metadata_file.exists():
              body="Automatic evidence harvest could not find the one-shot run. No successful evaluation can be claimed."
          else:
              r=json.loads(metadata_file.read_text())
              url=r.get("html_url","")
              body=f"One-shot public J-CRe3 diagnostic workflow: {url}\nStatus: {r.get('status')} / {r.get('conclusion')}\n"
              if r.get("conclusion")=="success":
                  root=pathlib.Path("/tmp/numeric-artifact")
                  root.mkdir(exist_ok=True)
                  subprocess.run(["gh","run","download",str(r["id"]),"--name",
                      "jcre3-fixed-qwen-attribution-metrics-only","--dir",str(root)],
                      check=True)
                  reports=list(root.glob("*.json"))
                  if len(reports)!=1:raise RuntimeError("Expected exactly one numeric JSON")
                  data=json.loads(reports[0].read_text())
                  if not data["completed"] or data["dataset"][:6]!="J-CRe3":
                      raise RuntimeError("Failed or wrong pilot")
                  lines=[]
                  for x in data["records"]:
                      if x["status"]!="success": raise RuntimeError("Incomplete ablation")
                      vals=x["arms"]
                      lines.append((x["record_id"],round(100*x["flattened_cer"],3),
                          round(100*x["baseline_original_cpcer"],3),
                          round(100*vals["conservative_exclusive"]["cpcer"],3),
                          round(100*vals["conservative_regular"]["cpcer"],3),
                          round(100*vals["human_turn_regions_diagnostic_only"]["cpcer"],3)))
                  body+="\nDevelopment-only, acted household Japanese dialogues (NOT meetings). No true editing time.\n\n"
                  body+="|record|flat CER|baseline cpCER|conservative excl cpCER|conservative regular cpCER|human turn diagnostic cpCER|\n"
                  body+="|---|---:|---:|---:|---:|---:|\n"
                  for row in lines:
                      body+="| "+" | ".join(map(str,row))+" |\n"
                  body+="\nNo v1 acceptance claim; all model source text frozen.\n"
          pathlib.Path("/tmp/numeric-comment.md").write_text(body)
          print("METRICS_ONLY_COMMENT_READY",len(body))
          PY
          gh pr comment 10 --body-file /tmp/numeric-comment.md
